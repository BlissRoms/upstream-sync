# Repo: BlissRoms/upstream-sync
# Path: .github/workflows/sync.yml
#
# Reusable workflow. Called by every Bliss repo's
# Org secrets required: TG_TOKEN, TG_CHAT

name: Upstream sync (reusable)

on:
  workflow_call:
    inputs:
      upstream_repo:
        description: "owner/name of the upstream repo"
        required: true
        type: string
      upstream_branch:
        description: "Upstream branch to merge from"
        required: true
        type: string
      target_branch:
        description: "Bliss branch to merge into"
        required: true
        type: string
      merge_strategy:
        description: "merge or rebase"
        required: false
        type: string
        default: merge
      bot_name:
        required: false
        type: string
        default: bliss-bot
      bot_email:
        required: false
        type: string
        default: bot@blissroms.org

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRATEGY: ${{ inputs.merge_strategy }}
        run: |
          set -euo pipefail
          git config user.name  "${{ inputs.bot_name }}"
          git config user.email "${{ inputs.bot_email }}"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Already up to date with ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}"
            exit 0
          fi

          before=$(git rev-parse HEAD)
          ok=0
          if [ "$STRATEGY" = "rebase" ]; then
            git rebase "upstream/${UPSTREAM_BRANCH}" && ok=1 || git rebase --abort
          else
            git merge --no-ff -m "Merge branch '${UPSTREAM_BRANCH}' into ${TARGET_BRANCH}" \
              "upstream/${UPSTREAM_BRANCH}" && ok=1 || true
          fi

          if [ "$ok" = "1" ]; then
            if [ "$STRATEGY" = "rebase" ]; then
              git push --force-with-lease origin "HEAD:${TARGET_BRANCH}"
            else
              git push origin "HEAD:${TARGET_BRANCH}"
            fi
            n=$(git rev-list --count "${before}..HEAD")
            echo "status=merged" >> "$GITHUB_OUTPUT"
            echo "commits=${n}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
          git merge --abort 2>/dev/null || true
          echo "status=conflict" >> "$GITHUB_OUTPUT"
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "::error::Conflict in: ${files}"
          exit 1

# Repo: BlissRoms/upstream-sync
# Path: .github/workflows/sync.yml
#
# Reusable workflow. Called by every Bliss repo's
# Org secrets required: BOT_NAME, BOT_EMAIL, TG_TOKEN, TG_CHAT
# Caller permissions required: contents: write, pull-requests: write

name: Upstream sync (reusable)

on:
  workflow_call:
    inputs:
      upstream_repo:
        description: "owner/name of the upstream repo"
        required: true
        type: string
      upstream_branch:
        description: "Upstream branch to merge from"
        required: true
        type: string
      target_branch:
        description: "Bliss branch to merge into"
        required: true
        type: string
      merge_strategy:
        description: "merge or rebase"
        required: false
        type: string
        default: merge
    secrets:
      BOT_NAME:
        required: true
      BOT_EMAIL:
        required: true
      TG_TOKEN:
        required: true
      TG_CHAT:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRATEGY: ${{ inputs.merge_strategy }}
        run: |
          set -euo pipefail
          git config user.name  "${{ secrets.BOT_NAME }}"
          git config user.email "${{ secrets.BOT_EMAIL }}"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Already up to date with ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}"
            exit 0
          fi

          before=$(git rev-parse HEAD)
          ok=0
          if [ "$STRATEGY" = "rebase" ]; then
            git rebase "upstream/${UPSTREAM_BRANCH}" && ok=1 || git rebase --abort
          else
            git merge --no-ff -m "Merge branch '${UPSTREAM_BRANCH}' into ${TARGET_BRANCH}" \
              "upstream/${UPSTREAM_BRANCH}" && ok=1 || true
          fi

          if [ "$ok" = "1" ]; then
            if [ "$STRATEGY" = "rebase" ]; then
              git push --force-with-lease origin "HEAD:${TARGET_BRANCH}"
            else
              git push origin "HEAD:${TARGET_BRANCH}"
            fi
            n=$(git rev-list --count "${before}..HEAD")
            echo "status=merged" >> "$GITHUB_OUTPUT"
            echo "commits=${n}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
          git merge --abort 2>/dev/null || true
          echo "status=conflict" >> "$GITHUB_OUTPUT"
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "::warning::Conflict in: ${files}"

      - name: Open PR for conflicting sync
        id: pr
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          set -euo pipefail
          sync_branch="sync/${UPSTREAM_BRANCH}-into-${TARGET_BRANCH}"

          # If a PR is already open someone may be resolving it on the
          # sync branch, so leave that branch alone and just report it.
          existing=$(gh pr list --base "${TARGET_BRANCH}" --head "${sync_branch}" \
            --state open --json url --jq '.[0].url // empty')
          if [ -n "${existing}" ]; then
            echo "pr_url=${existing}" >> "$GITHUB_OUTPUT"
            echo "PR already open: ${existing}"
            exit 0
          fi

          git push --force origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${sync_branch}"

          file_list=$(printf '%s\n' ${FILES} | sed 's/^/- /')
          body="Automatic sync of ${TARGET_BRANCH} from ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} hit conflicts and needs a manual merge.

          Conflicting files:
          ${file_list}

          To resolve: check out \`${sync_branch}\`, merge \`${TARGET_BRANCH}\` into it, fix the conflicts, push, then merge this PR."

          url=$(gh pr create \
            --base "${TARGET_BRANCH}" \
            --head "${sync_branch}" \
            --title "Sync ${TARGET_BRANCH} from ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} (conflicts)" \
            --body "${body}")
          echo "pr_url=${url}" >> "$GITHUB_OUTPUT"
          echo "Opened ${url}"

      - name: Notify
        if: failure() || steps.merge.outputs.status == 'conflict'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ steps.merge.outputs.status }}" = "conflict" ] && [ -n "${{ steps.pr.outputs.pr_url }}" ]; then
            msg="⚠️ CONFLICT ${{ github.repository }} (${{ inputs.target_branch }} ← ${{ inputs.upstream_repo }}@${{ inputs.upstream_branch }})
          Files: ${{ steps.merge.outputs.files }}
          PR: ${{ steps.pr.outputs.pr_url }}"
          elif [ "${{ steps.merge.outputs.status }}" = "conflict" ]; then
            msg="❌ CONFLICT ${{ github.repository }} (${{ inputs.target_branch }} ← ${{ inputs.upstream_repo }}@${{ inputs.upstream_branch }})
          Files: ${{ steps.merge.outputs.files }}
          Could not open PR, see run: ${RUN_URL}"
          else
            msg="❌ SYNC FAILED ${{ github.repository }} (${{ inputs.target_branch }} ← ${{ inputs.upstream_repo }}@${{ inputs.upstream_branch }})
          ${RUN_URL}"
          fi
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=${msg}"
